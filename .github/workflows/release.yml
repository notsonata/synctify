name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify release metadata
        run: python scripts/verify_release.py "$GITHUB_REF_NAME" --notes-out release-notes.md
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Smoke test packaged CLI
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python -m venv .venv-release
          .venv-release/bin/python -m pip install dist/synctify-*.whl
          .venv-release/bin/synctify --help >/dev/null
          .venv-release/bin/synctify tui --help >/dev/null
          VERSION="$VERSION" .venv-release/bin/python -c 'import os, synctify; assert synctify.__version__ == os.environ["VERSION"]'
      - name: Build macOS distribution bundle
        run: python scripts/build_distribution.py --dist-dir dist
      - name: Smoke test macOS distribution bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE="synctify-${VERSION}-macos"
          rm -rf .dist-release .dist-home
          mkdir .dist-release
          unzip -q "dist/${BUNDLE}.zip" -d .dist-release
          test -x ".dist-release/${BUNDLE}/synctify.sh"
          test -x ".dist-release/${BUNDLE}/install.sh"
          SYNCTIFY_PYTHON="$(command -v python)" ".dist-release/${BUNDLE}/synctify.sh" --help >/dev/null
          SYNCTIFY_PYTHON="$(command -v python)" ".dist-release/${BUNDLE}/synctify.sh" tui --help >/dev/null
          HOME="$PWD/.dist-home" \
            SHELL="/bin/zsh" \
            SYNCTIFY_PROFILE="$PWD/.dist-home/.zprofile" \
            ".dist-release/${BUNDLE}/synctify.sh" install >/dev/null
          test -x ".dist-home/.local/bin/synctify"
          test -L ".dist-home/Library/Application Support/Synctify/app/current"
          HOME="$PWD/.dist-home" \
            SYNCTIFY_PYTHON="$(command -v python)" \
            ".dist-home/.local/bin/synctify" --help >/dev/null
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE="synctify-${VERSION}-macos"
          gh release create "$GITHUB_REF_NAME" \
            "dist/${BUNDLE}.zip" \
            "dist/synctify-${VERSION}.tar.gz" \
            --verify-tag \
            --title "Synctify $VERSION" \
            --notes-file release-notes.md
