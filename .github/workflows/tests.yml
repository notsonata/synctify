name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Enforce version bump for product changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if printf '%s\n' "$CHANGED" | grep -Eq '^(src/|scripts/|distribution/|pyproject\.toml$)'; then
            BASE_VERSION="$(git show "$BASE_SHA:pyproject.toml" | python -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')"
            HEAD_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            if [[ "$BASE_VERSION" == "$HEAD_VERSION" ]]; then
              echo "::error::Product changes require a version bump (current version: $HEAD_VERSION)."
              exit 1
            fi
            for required in src/synctify/__init__.py README.md CHANGELOG.md; do
              if ! printf '%s\n' "$CHANGED" | grep -Fxq "$required"; then
                echo "::error::Product changes must update $required with the version bump."
                exit 1
              fi
            done
          fi
      - name: Test
        run: python -m pytest
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Smoke test packaged CLI
        run: |
          VERSION="$(python -c 'import synctify; print(synctify.__version__)')"
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install dist/synctify-*.whl
          .venv-smoke/bin/synctify --help
          .venv-smoke/bin/synctify tui --help
          .venv-smoke/bin/synctify self-update --help
          VERSION="$VERSION" .venv-smoke/bin/python -c 'import os, synctify; assert synctify.__version__ == os.environ["VERSION"]'
      - name: Build macOS distribution bundle
        run: python scripts/build_distribution.py --dist-dir dist
      - name: Smoke test macOS distribution bundle
        run: |
          VERSION="$(python -c 'import synctify; print(synctify.__version__)')"
          BUNDLE="synctify-${VERSION}-macos"
          rm -rf .dist-smoke .dist-home
          mkdir .dist-smoke
          unzip -q "dist/${BUNDLE}.zip" -d .dist-smoke
          test -x ".dist-smoke/${BUNDLE}/synctify.sh"
          test -x ".dist-smoke/${BUNDLE}/install.sh"
          SYNCTIFY_PYTHON="$(command -v python)" ".dist-smoke/${BUNDLE}/synctify.sh" --help
          SYNCTIFY_PYTHON="$(command -v python)" ".dist-smoke/${BUNDLE}/synctify.sh" tui --help
          SYNCTIFY_PYTHON="$(command -v python)" ".dist-smoke/${BUNDLE}/synctify.sh" self-update --help
          HOME="$PWD/.dist-home" \
            SHELL="/bin/zsh" \
            SYNCTIFY_PROFILE="$PWD/.dist-home/.zprofile" \
            ".dist-smoke/${BUNDLE}/synctify.sh" install
          test -x ".dist-home/.local/bin/synctify"
          test -L ".dist-home/Library/Application Support/Synctify/app/current"
          HOME="$PWD/.dist-home" \
            SYNCTIFY_PYTHON="$(command -v python)" \
            ".dist-home/.local/bin/synctify" --help
          HOME="$PWD/.dist-home" \
            SYNCTIFY_PYTHON="$(command -v python)" \
            ".dist-home/.local/bin/synctify" self-update --help
