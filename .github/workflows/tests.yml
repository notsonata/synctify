name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m pytest
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Smoke test packaged CLI
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install dist/synctify-*.whl
          .venv-smoke/bin/synctify --help
          .venv-smoke/bin/python -c 'import synctify; assert synctify.__version__ == "0.23.0"'
